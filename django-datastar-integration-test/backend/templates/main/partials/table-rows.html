{% for film in film_page %}
    <tr class="hover:bg-base-100 transition-colors">
        <td class="font-semibold text-primary">{{ film.title }}</td>
        <td class="text-base-content">{{ film.director }}</td>
        <td class="text-center">{{ film.release_year }}</td>
        <td class="text-center">
            <div class="badge badge-outline badge-sm">{{ film.get_genre_display }}</div>
        </td>
        <td class="text-center">
            <div class="flex items-center justify-center">
                <span class="text-warning mr-1">★</span>
                {{ film.rating }}
            </div>
        </td>
        <td class="text-center">{{ film.duration_display }}</td>
    </tr>
{% endfor %}
