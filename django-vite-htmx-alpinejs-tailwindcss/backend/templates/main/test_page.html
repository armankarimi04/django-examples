{% extends "_base.html" %}


{% block content %}
    <h2>Hello World</h2>
    
    <div>
        <!-- Testing DaisyUI and HTMX -->
        <button 
            hx-get="{% url 'main:htmx_test' %}"
            hx-target="#response_holder"
            class="btn btn-primary btn-sm w-36 m-20">
            Get message
        </button>
        <div id="response_holder"></div>
    </div>

    <div>
        <!-- Testing Alpine.js -->
        <div x-data="{ open: false }">
            <button class="btn btn-success btn-sm w-36 m-20" x-on:click="open = !open">Show message</button>
            <p x-show="open" @click.outside="open = false">Hi there, I'm Alpine.js</p>
        </div>
    </div>
{% endblock content %}
